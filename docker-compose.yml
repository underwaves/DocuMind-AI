version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    restart: always
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind_secret
      POSTGRES_DB: documind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
